<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container { text-align: center; padding: 40px; }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(0,200,255,0.2);
            border-top-color: #00c8ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 20px; margin-bottom: 12px; color: #00c8ff; }
        p { font-size: 14px; color: #8892b0; margin-bottom: 8px; }
        .error { color: #ff6b6b; font-size: 12px; margin-top: 16px; }
        button {
            margin-top: 20px;
            padding: 10px 24px;
            background: linear-gradient(135deg, #00c8ff, #0080ff);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner" id="spinner"></div>
        <h1 id="title">正在连接</h1>
        <p id="message">请稍候...</p>
        <p class="error" id="error"></p>
        <button id="retryBtn" onclick="location.reload()">重试</button>
    </div>
    <script>
        function getParam(name) {
            return new URLSearchParams(window.location.search).get(name);
        }
        async function redirect() {
            const type = getParam('type');
            const deviceCode = getParam('deviceCode') || '';
            try {
                const response = await fetch('config.json?t=' + Date.now(), { cache: 'no-store' });
                const config = await response.json();
                const publicUrl = config.publicUrl || config.url || '';
                if (publicUrl && publicUrl.trim() !== '') {
                    let targetUrl;
                    if (type === 'repair') {
                        targetUrl = publicUrl + '/mobile/repair?deviceCode=' + encodeURIComponent(deviceCode);
                        document.getElementById('title').textContent = '正在打开报修页面';
                    } else if (type === 'archive') {
                        const full = getParam('full') === '1' ? '&full=1' : '';
                        targetUrl = publicUrl + '/mobile/archive?deviceCode=' + encodeURIComponent(deviceCode) + full;
                        document.getElementById('title').textContent = full ? '正在打开设备全部信息' : '正在打开设备维保信息';
                    } else {
                        targetUrl = publicUrl + '/';
                        document.getElementById('title').textContent = '正在打开设备管理系统';
                    }
                    document.getElementById('message').textContent = '正在跳转...';
                    window.location.href = targetUrl;
                } else {
                    throw new Error('公网地址未配置');
                }
            } catch (error) {
                console.error('跳转失败:', error);
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('title').textContent = '连接失败';
                document.getElementById('message').textContent = '系统可能未启动，请稍后重试';
                document.getElementById('error').textContent = error.message;
                document.getElementById('retryBtn').style.display = 'inline-block';
            }
        }
        redirect();
    </script>
</body>
</html>
